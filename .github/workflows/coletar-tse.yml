name: Coletar TSE — Radar Eleitoral 2026

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar dados oficiais do TSE
        run: |
          python collector.py --turno auto

      - name: Verificar arquivos gerados
        run: |
          echo "===== ARQUIVOS PROCESSADOS ====="
          find data/processed -maxdepth 2 -type f -print
          echo "===== STATUS ====="
          cat data/processed/status.json

      - name: Commitar dados processados
        run: |
          git config user.name "Radar Eleitoral Bot"
          git config user.email "botelho-r4@users.noreply.github.com"

          git add data/processed/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "chore: atualizar dados TSE"
            git push
          fi
